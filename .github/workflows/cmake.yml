---
jobs:
  build-macos:
    permissions:
      attestations: write
      contents: write
      id-token: write
    runs-on: ${{ matrix.os.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install deps
        run: brew install extra-cmake-modules qt
      - env:
          BUILD_TYPE: ${{ matrix.build-type }}
          CPACK_SYSTEM_NAME: ${{ matrix.os.cpack_system }}
          WORKSPACE: ${{ github.workspace }}
        run: |
          cmake -G Ninja -B build -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCPACK_SYSTEM_NAME="$CPACK_SYSTEM_NAME" \
            --install-prefix "$WORKSPACE/build/prefix"
          cmake --build build --config "$BUILD_TYPE" --verbose
          cmake --install "$WORKSPACE/build" --config "$BUILD_TYPE" --verbose
      - env:
          WORKSPACE: ${{ github.workspace }}
        name: Ad-hoc codesign
        run: codesign --force --deep --sign - "$WORKSPACE/build/prefix/Hardware Viewer.app"
      - env:
          BUILD_TYPE: ${{ matrix.build-type }}
          WORKSPACE: ${{ github.workspace }}
        name: Package
        run: cpack -C "$BUILD_TYPE" --config "$WORKSPACE/build/CPackConfig.cmake" --verbose
      - name: 'Upload Artifacts'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' # v7.0.1
        with:
          if-no-files-found: error
          name: hwview-${{ matrix.build-type }}-${{ matrix.os.cpack_system }}
          path: |
            ${{github.workspace}}/hwview-*.zip
            ${{github.workspace}}/hwview-*.dmg
      - name: Attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{github.workspace}}/hwview-*.zip
            ${{github.workspace}}/hwview-*.dmg
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        if: ${{ github.ref_type == 'tag' }}
        name: Upload package
        run: |
          shopt -s nullglob
          files=(hwview-*.zip hwview-*.dmg)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo '::error::No macOS package files were produced; refusing to upload.'
            exit 1
          fi
          for _ in {1..10}; do
            if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
              break
            fi
            gh release create "$TAG" --repo "$REPO" --draft --title "$TAG" --notes '' && break
            sleep 5
          done
          gh release upload "$TAG" --repo "$REPO" --clobber "${files[@]}"
    strategy:
      fail-fast: false
      matrix:
        build-type: [Debug, Release]
        os:
          - cpack_system: Darwin-arm64
            image: macos-latest
          - cpack_system: Darwin-x86_64
            image: macos-15-intel
  build-msys:
    permissions:
      attestations: write
      contents: write
      id-token: write
    runs-on: ${{ matrix.sys.runner }}
    steps:
      - env:
          WORKSPACE: ${{ github.workspace }}
        id: fixed_workspace
        name: Fix path
        run: >-
          echo out=$($env:WORKSPACE -Replace "\\","/") | Out-File
          -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - if: matrix.sys.name == 'clangarm64'
        name: Install NSIS via Chocolatey
        run: |
          choco install nsis -y --no-progress
          'C:\Program Files (x86)\NSIS' | Out-File -Append -Encoding utf8 -FilePath $env:GITHUB_PATH
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          install: >-
            make
          msystem: ${{matrix.sys.name}}
          pacboy: >-
            cmake:p
            extra-cmake-modules:p
            ninja:p
            ${{ matrix.sys.name == 'clangarm64' && ' ' || 'nsis:p' }}
            qt6-base:p
            qt6-tools:p
            toolchain:p
            zlib:p
          update: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          BUILD_TYPE: ${{ matrix.build-type }}
          CPACK_SYSTEM: ${{ matrix.sys.cpack_system }}
          WORKSPACE: ${{ steps.fixed_workspace.outputs.out }}
        name: Configure
        run: >-
          cmake -G Ninja -B "$WORKSPACE/build"
          --install-prefix "$WORKSPACE/build/prefix"
          -DCMAKE_BUILD_TYPE="$BUILD_TYPE"
          -DCPACK_SYSTEM_NAME="$CPACK_SYSTEM"
          -DFHS=OFF
        shell: msys2 {0}
      - env:
          WORKSPACE: ${{ steps.fixed_workspace.outputs.out }}
        name: Build
        run: cmake --build "$WORKSPACE/build" --verbose
        shell: msys2 {0}
      - env:
          BUILD_TYPE: ${{ matrix.build-type }}
          WORKSPACE: ${{ steps.fixed_workspace.outputs.out }}
        name: Install
        run: cmake --install "$WORKSPACE/build" --config "$BUILD_TYPE" --verbose
        shell: msys2 {0}
      - env:
          BUILD_TYPE: ${{ matrix.build-type }}
          WORKSPACE: ${{ steps.fixed_workspace.outputs.out }}
        name: Package
        run: cpack -C "$BUILD_TYPE" --config "$WORKSPACE/build/CPackConfig.cmake" --verbose
        shell: msys2 {0}
      - name: 'Upload Artifacts'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' # v7.0.1
        with:
          if-no-files-found: error
          name: hwview-${{ matrix.build-type }}-${{ matrix.sys.name }}
          path: |
            ${{github.workspace}}/hwview-*.exe
            ${{github.workspace}}/hwview-*.zip
      - name: Attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{github.workspace}}/hwview-*.exe
            ${{github.workspace}}/hwview-*.zip
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        if: ${{ github.ref_type == 'tag' && matrix.sys.release }}
        name: Upload package
        run: |
          shopt -s nullglob
          files=(hwview-*.exe hwview-*.zip)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo '::error::No Windows package files were produced; refusing to upload.'
            exit 1
          fi
          for _ in {1..10}; do
            if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
              break
            fi
            gh release create "$TAG" --repo "$REPO" --draft --title "$TAG" --notes '' && break
            sleep 5
          done
          gh release upload "$TAG" --repo "$REPO" --clobber "${files[@]}"
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        build-type: [Debug, Release]
        sys:
          - cpack_system: win64
            env: x86_64
            name: mingw64
            release: false
            runner: windows-latest
          - cpack_system: win64
            env: ucrt-x86_64
            name: ucrt64
            release: true
            runner: windows-latest
          - cpack_system: winarm64
            env: clang-aarch64
            name: clangarm64
            release: true
            runner: windows-11-arm
  build-linux:
    permissions:
      attestations: write
      contents: write
      id-token: write
    runs-on: ${{ matrix.arch.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y extra-cmake-modules lcov libudev-dev tree
      - name: Install Qt
        uses: Tatsh/install-qt-action@c06aab43ae9bf6a28175c9cf45dd5936d44e21e9
      - env:
          BUILD_TYPE: ${{ matrix.build-type }}
          WORKSPACE: ${{ github.workspace }}
        name: Configure
        run: >-
          cmake -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -B "$WORKSPACE/build"
          --install-prefix "$WORKSPACE/build/AppDir/usr"
          -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON
          -DFHS=ON
      - env:
          BUILD_TYPE: ${{ matrix.build-type }}
          WORKSPACE: ${{ github.workspace }}
        name: Build
        run: cmake --build "$WORKSPACE/build" --verbose --config "$BUILD_TYPE"
      - env:
          BUILD_TYPE: ${{ matrix.build-type }}
          WORKSPACE: ${{ github.workspace }}
        name: Install
        run: cmake --install "$WORKSPACE/build" --config "$BUILD_TYPE" --verbose
      - env:
          BUILD_TYPE: ${{ matrix.build-type }}
          WORKSPACE: ${{ github.workspace }}
        name: Package
        run: cpack -C "$BUILD_TYPE" --config "$WORKSPACE/build/CPackConfig.cmake" --verbose
      - env:
          BUILD_TYPE: ${{ matrix.build-type }}
          DEPLOY_ARCH: ${{ matrix.arch.deploy_arch }}
          EXTRA_PLATFORM_PLUGINS: 'libqwayland-generic.so;libqwayland-egl.so'
          EXTRA_QT_PLUGINS: 'wayland-decoration-client;wayland-graphics-integration-client;wayland-shell-integration'
          WORKSPACE: ${{ github.workspace }}
        name: Create AppImage
        run: |
          wget "https://github.com/TheAssassin/linuxdeploy/releases/download/continuous/linuxdeploy-${DEPLOY_ARCH}.AppImage"
          wget "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-${DEPLOY_ARCH}.AppImage"
          chmod +x "linuxdeploy-${DEPLOY_ARCH}.AppImage" "linuxdeploy-plugin-qt-${DEPLOY_ARCH}.AppImage"
          QMAKE="$(command -v qmake6)"
          export QMAKE
          "./linuxdeploy-${DEPLOY_ARCH}.AppImage" --appdir "$WORKSPACE/build/AppDir" --plugin qt --output appimage
          rm "./linuxdeploy-${DEPLOY_ARCH}.AppImage" "./linuxdeploy-plugin-qt-${DEPLOY_ARCH}.AppImage"
          mv -v "$WORKSPACE"/*.AppImage "${WORKSPACE}/hwview-${BUILD_TYPE}-${DEPLOY_ARCH}.AppImage"
      - env:
          DEPLOY_ARCH: ${{ matrix.arch.deploy_arch }}
          REF_NAME: ${{ github.ref_name }}
          WORKSPACE: ${{ github.workspace }}
        if: ${{ github.ref_type == 'tag' && matrix.build-type == 'Release' }}
        name: Rename with tag
        run: mv -v "$WORKSPACE"/hwview-*.AppImage "${WORKSPACE}/hwview-${REF_NAME}-${DEPLOY_ARCH}.AppImage"
      - name: 'Upload Artifacts'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' # v7.0.1
        with:
          if-no-files-found: error
          name: hwview-${{ matrix.build-type }}-Linux-${{ matrix.arch.deploy_arch }}
          path: |
            ${{github.workspace}}/hwview-*.AppImage
            ${{github.workspace}}/hwview-*.zip
      - name: Attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{github.workspace}}/hwview-*.AppImage
            ${{github.workspace}}/hwview-*.zip
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        if: ${{ github.ref_type == 'tag' && matrix.build-type == 'Release' }}
        name: Upload package
        run: |
          shopt -s nullglob
          files=(hwview-*.AppImage)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo '::error::No AppImage was produced; refusing to upload.'
            exit 1
          fi
          for _ in {1..10}; do
            if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
              break
            fi
            gh release create "$TAG" --repo "$REPO" --draft --title "$TAG" --notes '' && break
            sleep 5
          done
          gh release upload "$TAG" --repo "$REPO" --clobber "${files[@]}"
    strategy:
      fail-fast: false
      matrix:
        arch:
          - deploy_arch: aarch64
            runner: ubuntu-24.04-arm
          - deploy_arch: x86_64
            runner: ubuntu-latest
        build-type: [Debug, Release]
name: Build
'on':
  push:
    branches: [master]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [master]
permissions:
  contents: read
